name: Android CI Build & Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Prepare fallback Secrets .env files
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then cp .env.example .env; fi
          if [ ! -f "app/.env" ] && [ -f "app/.env.example" ]; then cp app/.env.example app/.env; fi

      - name: Run Unit Test Suite
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace
